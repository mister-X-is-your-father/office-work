<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>週プランニング — 未アサインプール＋週レーン（かんばん配置）</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1d2430; --muted:#6b7480; --line:#e6e9ee;
    --track:#eef1f5; --fill:#3a86ff; --over:#e5484d; --free:#2fa66b; --full:#8a93a0;
    --cap:#9aa3af; --amber:#f5a623;
    --backend:#3a86ff; --frontend:#2fa66b; --qa:#b657d6; --common:#8a93a0;
    --m-morita:#e5772d; --m-tanaka:#3a86ff; --m-sato:#2fa66b; --m-suzuki:#b657d6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    font-feature-settings:"tnum";font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1480px;margin:0 auto;padding:20px 24px 60px}

  /* header */
  header.top{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:6px}
  .title h1{font-size:20px;font-weight:700;letter-spacing:.01em}
  .title .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .weeknav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:4px;margin-left:auto}
  .weeknav button{border:none;background:transparent;color:var(--muted);font-size:15px;cursor:pointer;
    width:30px;height:30px;border-radius:7px}
  .weeknav button:hover{background:var(--track);color:var(--ink)}
  .weeknav .wk{font-size:13px;font-weight:600;padding:0 10px;white-space:nowrap}
  .note{font-size:11px;color:var(--muted);margin:10px 0 18px;padding:7px 11px;background:#fff;
    border:1px dashed var(--line);border-radius:8px;display:inline-block}

  /* pool */
  .poolwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    margin-bottom:18px;box-shadow:0 1px 2px rgba(20,30,50,.04)}
  .poolhead{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .poolhead h2{font-size:13px;font-weight:700}
  .poolhead .cnt{font-size:11px;color:var(--muted);background:var(--track);border-radius:20px;padding:2px 9px}
  .poolhead .hint{margin-left:auto;font-size:11px;color:var(--muted)}
  .poolchips{display:flex;gap:10px;flex-wrap:wrap;min-height:46px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
    border-left-width:4px;border-radius:9px;padding:7px 11px;font-size:12px;cursor:grab;user-select:none;
    transition:box-shadow .12s,transform .12s;position:relative}
  .chip:hover{box-shadow:0 3px 10px rgba(20,30,50,.12);transform:translateY(-1px)}
  .chip.dragging{opacity:.4;cursor:grabbing}
  .chip .nm{font-weight:600}
  .chip .hrs{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px;
    background:var(--track);border-radius:5px;padding:1px 5px}
  .chip .ptag{font-size:10px;color:#fff;border-radius:4px;padding:1px 5px;font-weight:600}
  .chip.placed{opacity:.45;text-decoration:line-through;cursor:default;pointer-events:none}
  .p-backend{border-left-color:var(--backend)} .p-frontend{border-left-color:var(--frontend)}
  .p-qa{border-left-color:var(--qa)} .p-common{border-left-color:var(--common)}
  .bg-backend{background:var(--backend)} .bg-frontend{background:var(--frontend)}
  .bg-qa{background:var(--qa)} .bg-common{background:var(--common)}

  /* lanes */
  .lanes{display:flex;flex-direction:column;gap:14px}
  .lane{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 1px 2px rgba(20,30,50,.04);overflow:hidden}
  .laneTop{display:flex;align-items:center;padding:12px 16px;gap:12px;border-bottom:1px solid var(--line)}
  .ava{width:30px;height:30px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .who{font-size:14px;font-weight:700}
  .laneTop .meta{font-size:11px;color:var(--muted)}
  .weektotal{margin-left:auto;text-align:right;min-width:160px}
  .weektotal .num{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .weektotal .num .over{color:var(--over)} .weektotal .num .ok{color:var(--ink)}
  .wkbar{height:6px;border-radius:4px;background:var(--track);margin-top:5px;overflow:hidden;width:160px}
  .wkbar i{display:block;height:100%;border-radius:4px}

  .laneBody{display:flex;overflow-x:auto}
  .daycol{flex:1;min-width:150px;border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column}
  .daycol:last-child{border-right:none}
  .dhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .dhead .dname{font-size:11px;font-weight:700;color:var(--muted)}
  .dhead .dsum{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .dhead .dsum.over{color:var(--over);font-weight:700}
  .dropzone{flex:1;min-height:64px;border-radius:9px;border:1.5px dashed transparent;
    background:#fbfcfd;display:flex;flex-direction:column;gap:6px;padding:6px;transition:.12s}
  .dropzone.dragover{border-color:var(--fill);background:#eef5ff}
  .dropzone.over-cap{border-color:var(--over);background:#fdeced}
  .dchip{font-size:11px;border-radius:7px;padding:5px 7px;color:#fff;font-weight:600;
    display:flex;align-items:center;justify-content:space-between;gap:5px;line-height:1.25}
  .dchip .dh{font-size:10px;opacity:.85;font-weight:600}
  .dchip.ghost{background:#eef5ff;border:1.5px dashed var(--fill);color:var(--fill)}
  .capmini{height:5px;border-radius:3px;background:var(--track);margin-top:7px;overflow:hidden}
  .capmini i{display:block;height:100%}
  .emptyhint{font-size:10px;color:#c4cad3;text-align:center;margin:auto;pointer-events:none}

  /* lane footer remaining bar */
  .laneFoot{padding:10px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;background:#fbfcfd}
  .remLabel{font-size:11px;color:var(--muted);white-space:nowrap}
  .remBarWrap{flex:1;height:10px;border-radius:6px;background:var(--track);overflow:hidden;display:flex}
  .remBarWrap .used{height:100%;background:var(--fill)}
  .remBarWrap .used.ov{background:var(--over)}
  .remBarWrap .freeSeg{height:100%;background:var(--free);opacity:.5}
  .remNum{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .remNum .free{color:var(--free)} .remNum .over{color:var(--over)}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:20px;font-size:11px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#1d2430;color:#fff;font-size:12px;padding:9px 16px;border-radius:9px;opacity:0;
    transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title">
      <h1>② 計画：週プランニング — 配置ボード</h1>
      <div class="sub">未アサインタスクを、メンバー×曜日のレーンへ置いて週の負荷を組む</div>
    </div>
    <div class="weeknav">
      <button title="前の週">‹</button>
      <span class="wk">6/1〜6/5（今週）</span>
      <button title="次の週">›</button>
    </div>
  </header>
  <div class="note">※ モック（サンプルデータ）。本番は TaskStation API から自動算出。</div>

  <!-- ===== POOL ===== -->
  <section class="poolwrap">
    <div class="poolhead">
      <h2>未アサインプール（今週置きたい）</h2>
      <span class="cnt" id="poolCnt">4 件 / 計 12h</span>
      <span class="hint">↓ チップをレーンの曜日枠へドラッグして配置</span>
    </div>
    <div class="poolchips" id="pool"></div>
  </section>

  <!-- ===== LANES ===== -->
  <div class="lanes" id="lanes"></div>

  <div class="legend">
    <span><i class="sw bg-backend"></i>Backend</span>
    <span><i class="sw bg-frontend"></i>Frontend</span>
    <span><i class="sw bg-qa"></i>QA</span>
    <span><i class="sw bg-common"></i>共通</span>
    <span><i class="sw" style="background:var(--fill)"></i>容量内</span>
    <span><i class="sw" style="background:var(--over)"></i>超過</span>
    <span><i class="sw" style="background:var(--free);opacity:.5"></i>残容量（空き）</span>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const DAYS=[{k:"mon",n:"月 6/1"},{k:"tue",n:"火 6/2"},{k:"wed",n:"水 6/3"},{k:"thu",n:"木 6/4"},{k:"fri",n:"金 6/5"}];
const CAP=8, WEEKCAP=40;

// members with day assignments (task chips). Sums match spec.
const MEMBERS=[
  {id:"morita",name:"森田",color:"var(--m-morita)",
   days:{mon:[["API設計",5,"backend"],["MTG",3,"common"]],
         tue:[["DBマイグレ",4,"backend"],["PRレビュー",2,"backend"]],
         wed:[["認証実装",6,"backend"],["調査",2,"backend"]],
         thu:[["認証実装",6,"backend"],["障害対応",4,"backend"]],
         fri:[["設計ドキュメント",4,"backend"]]}},
  {id:"tanaka",name:"田中",color:"var(--m-tanaka)",
   days:{mon:[["ダッシュ画面実装",4,"frontend"]],
         tue:[["ダッシュ画面実装",4,"frontend"],["MTG",2,"common"]],
         wed:[["PRレビュー",2,"frontend"]],
         thu:[["ダッシュ画面実装",4,"frontend"]],
         fri:[]}},
  {id:"sato",name:"佐藤",color:"var(--m-sato)",
   days:{mon:[["結合テスト",5,"qa"],["MTG",3,"common"]],
         tue:[["結合テスト",8,"qa"]],
         wed:[["E2E整備",5,"qa"],["調査",3,"qa"]],
         thu:[["結合テスト",8,"qa"]],
         fri:[["結合テスト",5,"qa"],["リリース準備",3,"common"]]}},
  {id:"suzuki",name:"鈴木",color:"var(--m-suzuki)",
   days:{mon:[["LP制作",2,"frontend"]],
         tue:[["LP制作",3,"frontend"]],
         wed:[["調査",2,"frontend"]],
         thu:[["設計ドキュメント",2,"frontend"]],
         fri:[]}},
];

let POOL=[
  {id:"p1",name:"ログインバグ修正",hrs:3,proj:"backend",label:"Backend",placed:false},
  {id:"p2",name:"LP文言",hrs:2,proj:"frontend",label:"Frontend",placed:false},
  {id:"p3",name:"リリースノート",hrs:1,proj:"common",label:"共通",placed:false},
  {id:"p4",name:"E2E整備",hrs:6,proj:"qa",label:"QA",placed:false},
];
const PROJLABEL={backend:"Backend",frontend:"Frontend",qa:"QA",common:"共通"};

function dayHrs(m,d){return (m.days[d]||[]).reduce((s,t)=>s+t[1],0);}
function weekHrs(m){return DAYS.reduce((s,d)=>s+dayHrs(m,d.k),0);}

function renderPool(){
  const el=document.getElementById("pool"); el.innerHTML="";
  let remain=POOL.filter(p=>!p.placed);
  let tot=remain.reduce((s,p)=>s+p.hrs,0);
  document.getElementById("poolCnt").textContent=`${remain.length} 件 / 計 ${tot}h`;
  POOL.forEach(p=>{
    const c=document.createElement("div");
    c.className="chip p-"+p.proj+(p.placed?" placed":"");
    c.draggable=!p.placed; c.dataset.pid=p.id;
    c.innerHTML=`<span class="ptag bg-${p.proj}">${PROJLABEL[p.proj]}</span>
      <span class="nm">${p.name}</span><span class="hrs">${p.hrs}h</span>`;
    if(!p.placed){
      c.addEventListener("dragstart",e=>{drag={pid:p.id};c.classList.add("dragging");
        e.dataTransfer.effectAllowed="move";});
      c.addEventListener("dragend",()=>{c.classList.remove("dragging");clearGhosts();});
    }
    el.appendChild(c);
  });
}

let drag=null;

function renderLanes(){
  const lanes=document.getElementById("lanes"); lanes.innerHTML="";
  MEMBERS.forEach(m=>{
    const wk=weekHrs(m); const over=wk>WEEKCAP; const free=Math.max(0,WEEKCAP-wk);
    const lane=document.createElement("div"); lane.className="lane";
    // top
    const pct=Math.min(100,wk/WEEKCAP*100);
    const usedColor= over?"var(--over)":(wk===WEEKCAP?"var(--full)":"var(--fill)");
    lane.innerHTML=`
      <div class="laneTop">
        <div class="ava" style="background:${m.color}">${m.name[0]}</div>
        <div><div class="who">${m.name}</div><div class="meta">8h/日 · 週${WEEKCAP}h</div></div>
        <div class="weektotal">
          <div class="num">週合計 <span class="${over?'over':'ok'}">${wk}</span> / ${WEEKCAP}h${over?` <span class="over">超過+${wk-WEEKCAP}</span>`:''}</div>
          <div class="wkbar"><i style="width:${pct}%;background:${usedColor}"></i></div>
        </div>
      </div>
      <div class="laneBody" data-mid="${m.id}"></div>
      <div class="laneFoot">
        <span class="remLabel">残容量</span>
        <div class="remBarWrap">
          <div class="used ${over?'ov':''}" style="width:${over?100:wk/WEEKCAP*100}%"></div>
          ${over?'':`<div class="freeSeg" style="width:${free/WEEKCAP*100}%"></div>`}
        </div>
        <span class="remNum">${over?`<span class="over">超過 ${wk-WEEKCAP}h</span>`:`あと <span class="free">${free}h</span> 置ける`}</span>
      </div>`;
    const body=lane.querySelector(".laneBody");
    DAYS.forEach(d=>{
      const dh=dayHrs(m,d.k); const dover=dh>CAP;
      const col=document.createElement("div"); col.className="daycol";
      col.innerHTML=`<div class="dhead"><span class="dname">${d.n}</span>
        <span class="dsum ${dover?'over':''}">${dh}/${CAP}h</span></div>
        <div class="dropzone" data-mid="${m.id}" data-day="${d.k}"></div>
        <div class="capmini"><i style="width:${Math.min(100,dh/CAP*100)}%;background:${dover?'var(--over)':(dh===CAP?'var(--full)':'var(--fill)')}"></i></div>`;
      const dz=col.querySelector(".dropzone");
      (m.days[d.k]||[]).forEach(t=>{
        const ch=document.createElement("div");
        ch.className="dchip bg-"+t[2];
        ch.innerHTML=`<span>${t[0]}</span><span class="dh">${t[1]}h</span>`;
        dz.appendChild(ch);
      });
      if((m.days[d.k]||[]).length===0){
        const e=document.createElement("div");e.className="emptyhint";e.textContent="空き";dz.appendChild(e);
      }
      // drop handlers
      dz.addEventListener("dragover",e=>{e.preventDefault();
        const p=POOL.find(x=>x.id===drag?.pid); if(!p)return;
        const willOver=(dh+p.hrs)>CAP;
        dz.classList.add(willOver?"over-cap":"dragover");
        showGhost(dz,p,willOver);});
      dz.addEventListener("dragleave",()=>{dz.classList.remove("dragover","over-cap");removeGhost(dz);});
      dz.addEventListener("drop",e=>{e.preventDefault();
        dz.classList.remove("dragover","over-cap");
        const p=POOL.find(x=>x.id===drag?.pid); if(!p||p.placed)return;
        m.days[d.k]=m.days[d.k]||[];
        m.days[d.k].push([p.name,p.hrs,p.proj]);
        p.placed=true; drag=null;
        const newdh=dayHrs(m,d.k);
        renderAll();
        toast(`${m.name}・${d.n} に「${p.name}」(${p.hrs}h) を配置 → 日計 ${newdh}/${CAP}h`);
      });
      body.appendChild(col);
    });
    lanes.appendChild(lane);
  });
}

function showGhost(dz,p,over){
  removeGhost(dz);
  const g=document.createElement("div");
  g.className="dchip ghost _ghost";
  g.innerHTML=`<span>${p.name}${over?' ⚠':''}</span><span class="dh">${p.hrs}h</span>`;
  const eh=dz.querySelector(".emptyhint"); if(eh)eh.style.display="none";
  dz.appendChild(g);
}
function removeGhost(dz){const g=dz.querySelector("._ghost");if(g)g.remove();
  const eh=dz.querySelector(".emptyhint");if(eh)eh.style.display="";}
function clearGhosts(){document.querySelectorAll("._ghost").forEach(g=>g.remove());
  document.querySelectorAll(".dropzone").forEach(d=>d.classList.remove("dragover","over-cap"));
  document.querySelectorAll(".emptyhint").forEach(e=>e.style.display="");}

let toastT;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600);}

function renderAll(){renderPool();renderLanes();}
renderAll();
</script>
</body>
</html>
