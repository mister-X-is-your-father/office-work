<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WBS / 階層ツリー — 新ダッシュボード機能</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1d2430; --muted:#6b7480; --line:#e6e9ee; --track:#eef1f5;
    --done:#2fa66b; --doing:#3a86ff; --todo:#9aa3af; --blocked:#e5484d;
    --m-morita:#e5772d; --m-tanaka:#3a86ff; --m-sato:#2fa66b; --m-suzuki:#b657d6;
    --pj-be:#3a86ff; --pj-fe:#2fa66b; --pj-qa:#b657d6; --pj-common:#8a93a0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    font-size:13.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums; font-feature-settings:"tnum";
  }
  .wrap{max-width:1000px; margin:0 auto; padding:24px 20px 60px}
  header.page{margin-bottom:16px}
  .crumb{font-size:12px; color:var(--muted); margin-bottom:4px}
  h1{font-size:20px; margin:0 0 4px; letter-spacing:.01em}
  .sub{font-size:12.5px; color:var(--muted)}
  .note{
    margin:10px 0 18px; padding:8px 12px; font-size:12px; color:var(--muted);
    background:#fbfcfd; border:1px solid var(--line); border-radius:8px;
  }
  .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
  .btn{
    font:inherit; font-size:12.5px; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer;
  }
  .btn:hover{background:#f1f3f6}
  .spacer{flex:1}
  .legend{display:flex; gap:12px; align-items:center; font-size:11.5px; color:var(--muted)}
  .legend .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:middle}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 1px 2px rgba(20,30,50,.04), 0 6px 18px rgba(20,30,50,.03);
    overflow:hidden;
  }

  /* tree */
  .tree{padding:6px 0}
  .node{position:relative}
  .row{
    display:grid;
    grid-template-columns:minmax(280px,1fr) 150px 80px 96px;
    gap:14px; align-items:center;
    padding:8px 18px 8px 0; border-bottom:1px solid var(--line);
  }
  .node:last-child > .row{border-bottom:none}
  .label{display:flex; align-items:center; min-width:0}
  .twirl{
    width:18px; height:18px; flex:none; border:none; background:none; cursor:pointer;
    color:var(--muted); display:inline-flex; align-items:center; justify-content:center;
    transition:transform .15s ease; margin-right:2px;
  }
  .twirl svg{width:10px; height:10px}
  .twirl.collapsed{transform:rotate(-90deg)}
  .twirl.leaf{visibility:hidden}
  .name{
    font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;
  }
  .epic .name{font-weight:700; font-size:14px}
  .task .name{font-weight:500}
  .sub .name{color:#374050; font-size:13px}

  /* indent guides via padding on label wrapper */
  .d0 .label{padding-left:16px}
  .d1 .label{padding-left:40px}
  .d2 .label{padding-left:68px}
  .node .label::before{
    content:""; position:absolute; top:0; bottom:0; border-left:1px solid var(--line);
  }
  .d1 .label::before{left:30px}
  .d2 .label::before{left:58px}
  .d0 .label::before{display:none}

  .badge{
    font-size:10.5px; padding:1px 7px; border-radius:999px; color:#fff; flex:none; margin-left:8px;
    font-weight:600; letter-spacing:.02em;
  }
  .st-done{background:var(--done)} .st-doing{background:var(--doing)}
  .st-todo{background:var(--todo)} .st-blocked{background:var(--blocked)}

  .pjtag{
    font-size:10px; padding:1px 6px; border-radius:5px; margin-left:8px; flex:none;
    border:1px solid currentColor; background:transparent; font-weight:600;
  }

  /* progress cell */
  .prog{display:flex; align-items:center; gap:8px}
  .bar{flex:1; height:7px; background:var(--track); border-radius:999px; overflow:hidden}
  .bar > i{display:block; height:100%; border-radius:999px}
  .pct{width:38px; text-align:right; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
  .rollup .pct{font-weight:700; color:var(--ink)}
  .rollup .name::after{content:" ⟲"; color:var(--muted); font-size:11px}

  /* assignee */
  .who{display:flex; align-items:center; gap:6px; font-size:12px; color:#404a58}
  .av{
    width:20px; height:20px; border-radius:50%; color:#fff; flex:none;
    display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:700;
  }
  .unassigned{color:var(--muted); font-style:normal}
  .unassigned .av{background:#cbd2db; color:#fff}

  .hours{font-size:12px; color:var(--muted); text-align:right}

  /* column header */
  .colhead{
    display:grid; grid-template-columns:minmax(280px,1fr) 150px 80px 96px; gap:14px;
    padding:9px 18px 9px 16px; font-size:11px; color:var(--muted); border-bottom:1px solid var(--line);
    background:#fbfcfd; letter-spacing:.04em; text-transform:uppercase; font-weight:600;
  }
  .colhead .r{text-align:right}

  .children.hidden{display:none}

  .summary{
    display:flex; gap:18px; flex-wrap:wrap; margin:16px 0 4px; padding:14px 16px;
  }
  .stat{display:flex; flex-direction:column; gap:2px}
  .stat .k{font-size:11px; color:var(--muted)}
  .stat .v{font-size:18px; font-weight:700; font-variant-numeric:tabular-nums}
  .stat .v small{font-size:12px; font-weight:500; color:var(--muted)}

  @media(max-width:720px){
    .row, .colhead{grid-template-columns:minmax(150px,1fr) 92px; }
    .colhead .c-who,.colhead .c-hours,.row .who,.row .hours{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div class="crumb">プロジェクト / 新ダッシュボード機能</div>
    <h1>WBS / 階層ツリー</h1>
    <div class="sub">エピック → タスク → サブタスクの分解と、子からのロールアップ進捗　<span style="color:#404a58">本日 6/4 (木)</span></div>
  </header>

  <div class="note">※ モック（サンプルデータ）。本番は TaskStation API（親子・サブタスク）から自動算出。</div>

  <div class="toolbar">
    <button class="btn" id="expandAll">すべて展開</button>
    <button class="btn" id="collapseAll">すべて折りたたむ</button>
    <div class="spacer"></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--done)"></span>Done</span>
      <span><span class="dot" style="background:var(--doing)"></span>Doing</span>
      <span><span class="dot" style="background:var(--todo)"></span>Todo</span>
      <span><span class="dot" style="background:var(--blocked)"></span>Blocked</span>
    </div>
  </div>

  <div class="card summary">
    <div class="stat"><span class="k">全体進捗 (ロールアップ)</span><span class="v">58<small>%</small></span></div>
    <div class="stat"><span class="k">認証エピック</span><span class="v">55<small>%</small></span></div>
    <div class="stat"><span class="k">ダッシュボード</span><span class="v">40<small>%</small></span></div>
    <div class="stat"><span class="k">タスク総数</span><span class="v">10 <small>/ サブ 6</small></span></div>
    <div class="stat"><span class="k">合計工数</span><span class="v">39<small>h</small></span></div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="colhead">
      <div>機能の分解（WBS）</div>
      <div>進捗</div>
      <div class="r c-who">担当</div>
      <div class="r c-hours">工数</div>
    </div>
    <div class="tree" id="tree"></div>
  </div>
</div>

<script>
const M = {
  morita:{n:"森田",c:"#e5772d"}, tanaka:{n:"田中",c:"#3a86ff"},
  sato:{n:"佐藤",c:"#2fa66b"}, suzuki:{n:"鈴木",c:"#b657d6"}, none:{n:"未",c:"#cbd2db",un:true}
};
const PJ = { be:{n:"Backend",c:"#3a86ff"}, fe:{n:"Frontend",c:"#2fa66b"}, qa:{n:"QA",c:"#b657d6"}, common:{n:"共通",c:"#8a93a0"} };

// data: progress null => rollup from children
const DATA = [
  {name:"認証", kind:"epic", pj:"be", pct:55, rollup:true, children:[
    {name:"DBマイグレーション", kind:"task", st:"done", who:"morita", h:3, pct:80},
    {name:"認証フロー実装", kind:"task", st:"blocked", who:"sato", h:5, pct:40, rollup:true, children:[
      {name:"トークン発行", kind:"sub", st:"done", who:"sato", h:null, pct:100},
      {name:"セッション管理", kind:"sub", st:"doing", who:"sato", h:null, pct:50},
      {name:"外部API連携（待ち）", kind:"sub", st:"blocked", who:"sato", h:null, pct:0},
    ]},
    {name:"PRレビュー #142", kind:"task", st:"doing", who:"sato", h:1, pct:50, note:"佐藤→森田"},
  ]},
  {name:"ダッシュボード画面", kind:"epic", pj:"fe", pct:40, rollup:true, children:[
    {name:"ダッシュ画面実装", kind:"task", st:"doing", who:"tanaka", h:4, pct:60, rollup:true, children:[
      {name:"レイアウト", kind:"sub", st:"done", who:"tanaka", h:null, pct:100},
      {name:"グラフ描画", kind:"sub", st:"doing", who:"tanaka", h:null, pct:55},
      {name:"データ接続", kind:"sub", st:"todo", who:"tanaka", h:null, pct:0},
    ]},
    {name:"LP制作", kind:"task", st:"todo", who:"tanaka", h:8, pct:0},
  ]},
  {name:"品質", kind:"epic", pj:"qa", pct:0, rollup:true, children:[
    {name:"結合テスト", kind:"task", st:"todo", who:"sato", h:6, pct:0},
  ]},
  {name:"リリース", kind:"epic", pj:"common", pct:0, rollup:true, children:[
    {name:"リリースノート", kind:"task", st:"todo", who:"none", h:1, pct:0},
    {name:"リリース準備", kind:"task", st:"todo", who:"morita", h:4, pct:0},
  ]},
];

const ST_CLASS = {done:"st-done",doing:"st-doing",todo:"st-todo",blocked:"st-blocked"};
const ST_LABEL = {done:"Done",doing:"Doing",todo:"Todo",blocked:"Blocked"};
const ST_COLOR = {done:"#2fa66b",doing:"#3a86ff",todo:"#9aa3af",blocked:"#e5484d"};

function barColor(pct, st){
  if(st && ST_COLOR[st]) return ST_COLOR[st];
  return pct>=100?ST_COLOR.done:(pct>0?ST_COLOR.doing:ST_COLOR.todo);
}

function node(d, depth){
  const wrap = document.createElement("div");
  wrap.className = "node " + d.kind + " d"+depth + (d.rollup?" rollup":"");
  const hasKids = d.children && d.children.length;

  const row = document.createElement("div");
  row.className = "row";

  // label
  const label = document.createElement("div");
  label.className = "label";
  const tw = document.createElement("button");
  tw.className = "twirl" + (hasKids?"":" leaf");
  tw.innerHTML = '<svg viewBox="0 0 10 10"><path d="M2 1 L8 5 L2 9 Z" fill="currentColor"/></svg>';
  label.appendChild(tw);

  const nm = document.createElement("span");
  nm.className = "name";
  nm.textContent = d.name;
  label.appendChild(nm);

  if(d.kind==="epic" && d.pj){
    const t = document.createElement("span");
    t.className = "pjtag"; t.style.color = PJ[d.pj].c; t.textContent = PJ[d.pj].n;
    label.appendChild(t);
  }
  if(d.st){
    const b = document.createElement("span");
    b.className = "badge " + ST_CLASS[d.st]; b.textContent = ST_LABEL[d.st];
    label.appendChild(b);
  }
  row.appendChild(label);

  // progress
  const prog = document.createElement("div");
  prog.className = "prog";
  const bar = document.createElement("div"); bar.className="bar";
  const fill = document.createElement("i");
  fill.style.width = (d.pct||0)+"%";
  fill.style.background = barColor(d.pct||0, d.st);
  bar.appendChild(fill);
  const pct = document.createElement("span"); pct.className="pct"; pct.textContent=(d.pct||0)+"%";
  prog.appendChild(bar); prog.appendChild(pct);
  row.appendChild(prog);

  // who
  const who = document.createElement("div");
  const m = M[d.who||"none"];
  who.className = "who c-who" + (m.un?" unassigned":"");
  if(d.who){
    const av = document.createElement("span"); av.className="av"; av.style.background=m.c; av.textContent=m.n[0];
    who.appendChild(av);
    const t = document.createElement("span"); t.textContent = d.note||m.n; who.appendChild(t);
  } else { who.textContent=""; }
  row.appendChild(who);

  // hours
  const h = document.createElement("div");
  h.className="hours c-hours";
  h.textContent = d.h!=null ? d.h+"h" : "—";
  row.appendChild(h);

  wrap.appendChild(row);

  if(hasKids){
    const ch = document.createElement("div");
    ch.className = "children";
    d.children.forEach(c=>ch.appendChild(node(c, depth+1)));
    wrap.appendChild(ch);
    tw.addEventListener("click", ()=>{
      const hidden = ch.classList.toggle("hidden");
      tw.classList.toggle("collapsed", hidden);
    });
  }
  return wrap;
}

const tree = document.getElementById("tree");
DATA.forEach(d=>tree.appendChild(node(d,0)));

document.getElementById("expandAll").addEventListener("click",()=>{
  document.querySelectorAll(".children").forEach(c=>c.classList.remove("hidden"));
  document.querySelectorAll(".twirl").forEach(t=>t.classList.remove("collapsed"));
});
document.getElementById("collapseAll").addEventListener("click",()=>{
  // collapse only down to epics (keep top level visible)
  document.querySelectorAll(".node.task .children, .node.sub .children").forEach(c=>c.classList.add("hidden"));
  document.querySelectorAll(".node.task > .row .twirl:not(.leaf), .node.sub > .row .twirl:not(.leaf)").forEach(t=>t.classList.add("collapsed"));
});
</script>
</body>
</html>
