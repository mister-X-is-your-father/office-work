<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日の空き容量さがし ｜ バレットチャート</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1d2430; --muted:#6b7480; --line:#e6e9ee;
    --track:#eef1f5; --fill:#3a86ff; --over:#e5484d; --free:#2fa66b; --full:#8a93a0;
    --caprule:#9aa3af;
    --p-backend:#3a86ff; --p-frontend:#2fa66b; --p-qa:#b657d6; --p-common:#8a93a0;
    --font:"Hiragino Kaku Gothic ProN",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font);
    font-feature-settings:"palt"; -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums; padding:28px 20px 60px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  header{margin-bottom:22px;}
  .titlerow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  h1{font-size:22px;font-weight:700;margin:0;letter-spacing:.01em;}
  .subtitle{font-size:13px;color:var(--muted);}
  .nav{display:flex;align-items:center;gap:0;margin-top:14px;background:var(--card);
    border:1px solid var(--line);border-radius:11px;padding:4px;width:max-content;
    box-shadow:0 1px 2px rgba(20,30,50,.04);}
  .nav button{border:0;background:transparent;color:var(--muted);font-size:15px;
    cursor:pointer;padding:6px 11px;border-radius:8px;line-height:1;}
  .nav button:hover{background:var(--track);color:var(--ink);}
  .nav .cur{color:var(--ink);font-weight:600;font-size:15px;padding:6px 14px;}
  .nav .today{font-size:11px;color:var(--free);font-weight:700;margin-left:2px;}
  .note{font-size:11.5px;color:var(--muted);margin-top:11px;line-height:1.5;}
  .summary{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 14px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:13px 16px;box-shadow:0 1px 2px rgba(20,30,50,.04);min-width:120px;}
  .kpi .lbl{font-size:11px;color:var(--muted);margin-bottom:5px;letter-spacing:.02em;}
  .kpi .val{font-size:21px;font-weight:700;line-height:1;}
  .kpi .val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px;}
  .kpi.free .val{color:var(--free);}
  .kpi.over .val{color:var(--over);}

  .legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:2px 0 6px;font-size:11.5px;color:var(--muted);}
  .legend .item{display:flex;align-items:center;gap:6px;}
  .band{width:13px;height:11px;border-radius:2px;display:inline-block;}
  .measure{width:18px;height:8px;border-radius:2px;background:var(--ink);display:inline-block;}
  .markicon{width:3px;height:14px;background:var(--ink);display:inline-block;border-radius:1px;}

  .chartcard{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:22px 24px 16px;margin-top:8px;box-shadow:0 2px 10px rgba(20,30,50,.05);}
  :root{--labelw:104px; --vgut:96px;}
  .ruler{position:relative;height:20px;margin-left:var(--labelw);margin-right:var(--vgut);}
  .ruler .tk{position:absolute;top:0;transform:translateX(-50%);font-size:10.5px;color:var(--muted);}

  .brow{display:flex;align-items:center;padding:11px 0;}
  .brow + .brow{border-top:1px solid var(--line);}
  .blabel{width:var(--labelw);flex:none;padding-right:12px;text-align:right;}
  .blabel .nm{font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:flex-end;gap:6px;}
  .blabel .nm .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .blabel .pct{font-size:11px;color:var(--muted);margin-top:2px;}

  .bullet{position:relative;flex:1;height:34px;}
  /* qualitative bands background */
  .bands{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:7px;overflow:hidden;
    display:flex;}
  .bg1{background:#eef1f5;}   /* 0-50% : light */
  .bg2{background:#e3e8ef;}   /* 50-100% : medium */
  .bg3{background:#fbe1e2;}   /* >100% over : red tint */
  /* measure bar (actual hours) */
  .meas{position:absolute;top:8px;bottom:8px;left:0;border-radius:5px;
    background:var(--fill);box-shadow:0 1px 2px rgba(20,30,50,.18);z-index:3;
    transition:width .3s;}
  .meas.over{background:var(--over);}
  /* part of measure beyond cap shown hatched even within red bar */
  .measover{position:absolute;top:8px;bottom:8px;border-radius:0 5px 5px 0;z-index:4;
    background:repeating-linear-gradient(135deg,rgba(255,255,255,.0),rgba(255,255,255,.0) 5px,rgba(255,255,255,.35) 5px,rgba(255,255,255,.35) 10px);}
  /* target marker (capacity 8h) */
  .target{position:absolute;top:2px;bottom:2px;width:3px;background:var(--ink);
    z-index:6;border-radius:2px;}
  .target.crossed{background:var(--over);box-shadow:0 0 0 2px rgba(229,72,77,.18);}
  /* value chip */
  .bval{width:var(--vgut);flex:none;padding-left:14px;font-size:13px;font-weight:700;}
  .bval .h{font-size:15px;}
  .bval.free{color:var(--free);}
  .bval.over{color:var(--over);}
  .bval.full{color:var(--full);}
  .bval small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-top:1px;}
  /* hover tip on measure */
  .meas[data-tip]:hover::after, .target[data-tip]:hover::after{content:attr(data-tip);
    position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);
    background:#1d2430;color:#fff;font-size:11px;padding:5px 9px;border-radius:7px;
    white-space:nowrap;z-index:30;box-shadow:0 4px 12px rgba(0,0,0,.2);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titlerow">
      <h1>今日の空き容量さがし</h1>
      <span class="subtitle">バレットチャート（容量に対する位置）</span>
    </div>
    <div class="nav">
      <button aria-label="前の日">‹</button>
      <span class="cur">6/4(木)</span>
      <span class="today">今日</span>
      <button aria-label="次の日">›</button>
    </div>
    <div class="note">※ モック（サンプルデータ）。本番は Vikunja API から自動算出。容量は一律 8h/人。</div>
  </header>

  <div class="summary">
    <div class="kpi"><div class="lbl">チーム稼働</div><div class="val">24<small>/32h</small></div></div>
    <div class="kpi"><div class="lbl">稼働率</div><div class="val">75<small>%</small></div></div>
    <div class="kpi free"><div class="lbl">振れる空き</div><div class="val">8<small>h</small></div></div>
    <div class="kpi over"><div class="lbl">超過</div><div class="val">+2<small>h</small></div></div>
  </div>

  <div class="legend">
    <span class="item"><span class="band" style="background:#eef1f5"></span>〜50%</span>
    <span class="item"><span class="band" style="background:#e3e8ef"></span>〜100%</span>
    <span class="item"><span class="band" style="background:#fbe1e2"></span>超過</span>
    <span class="item"><span class="measure"></span>実測（アサイン時間）</span>
    <span class="item"><span class="markicon"></span>目標＝容量 8h</span>
  </div>

  <div class="chartcard">
    <div class="ruler" id="ruler"></div>
    <div id="rows"></div>
  </div>
</div>

<script>
const CAP = 8;
let members = [
  { name:"森田", dot:"#e5772d", total:10 },
  { name:"田中", dot:"#3a86ff", total:4 },
  { name:"佐藤", dot:"#2fa66b", total:8 },
  { name:"鈴木", dot:"#b657d6", total:2 },
];
// free space desc
members.sort((a,b)=> (CAP-b.total) - (CAP-a.total));

const MAX_H = 11; // axis range
const pct = h => (h/MAX_H)*100;

// ruler
const ruler = document.getElementById("ruler");
for(let h=0; h<=10; h+=2){
  const t=document.createElement("div");
  t.className="tk"; t.style.left=pct(h)+"%"; t.textContent=h+"h";
  ruler.appendChild(t);
}

const rows = document.getElementById("rows");
members.forEach(m=>{
  const over = m.total - CAP;
  const ratio = Math.round(m.total/CAP*100);

  let valCls = over>0?"over":(over===0?"full":"free");
  let valMain = over>0?("+"+over+"h 超過"):(over===0?"満（0h）":("空き "+(CAP-m.total)+"h"));
  let valSub = "実測 "+m.total+"h";

  const row = document.createElement("div");
  row.className="brow";

  // measure width: capped visual? we show full actual width up to MAX_H
  const measW = pct(Math.min(m.total, MAX_H));
  const capX = pct(CAP);
  // over hatch overlay from cap to total
  const overOverlay = over>0
    ? `<div class="measover" style="left:${capX}%;width:${pct(m.total)-capX}%"></div>` : "";

  row.innerHTML =
    `<div class="blabel">`+
      `<div class="nm"><span class="dot" style="background:${m.dot}"></span>${m.name}</div>`+
      `<div class="pct">${ratio}% 稼働</div>`+
    `</div>`+
    `<div class="bullet">`+
      `<div class="bands">`+
        `<div class="bg1" style="width:${pct(4)}%"></div>`+
        `<div class="bg2" style="width:${pct(4)}%"></div>`+
        `<div class="bg3" style="width:${pct(MAX_H-8)}%"></div>`+
      `</div>`+
      `<div class="meas ${over>0?'over':''}" style="width:${measW}%" data-tip="アサイン ${m.total}h / 容量 ${CAP}h（${ratio}%）"></div>`+
      overOverlay+
      `<div class="target ${over>0?'crossed':''}" style="left:${capX}%" data-tip="容量（目標）8h"></div>`+
    `</div>`+
    `<div class="bval ${valCls}">${valMain}<small>${valSub}</small></div>`;
  rows.appendChild(row);
});
</script>
</body>
</html>
