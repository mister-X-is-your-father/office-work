<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capacity Board — モックギャラリー（切り口別・全72案）</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1d2430;--muted:#6b7480;--line:#e6e9ee;--fill:#3a86ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;padding:30px 22px 70px}
  h1{font-size:22px;margin:0 0 4px}
  .lead{color:var(--muted);font-size:14px;margin:0 0 6px}
  .req{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:10px 14px;margin:14px 0 10px;display:inline-block}
  .req b{color:var(--ink)}
  .nav{font-size:12px;color:var(--muted);margin:6px 0 6px;display:flex;gap:8px 14px;flex-wrap:wrap;
    position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--line)}
  .nav a{color:var(--fill);text-decoration:none} .nav a:hover{text-decoration:underline}
  .grp{margin-top:34px;scroll-margin-top:58px}
  .grp h2{font-size:15px;margin:0 0 2px}
  .grp .gd{font-size:12px;color:var(--muted);margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:18px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    text-decoration:none;color:inherit;box-shadow:0 6px 18px rgba(20,30,50,.04);
    transition:border-color .12s, transform .12s}
  .item:hover{border-color:var(--fill);transform:translateY(-2px)}
  .thumb{position:relative;height:168px;background:#fff;border-bottom:1px solid var(--line);overflow:hidden}
  .thumb iframe{position:absolute;top:0;left:0;width:1100px;height:820px;border:0;
    transform:scale(.225);transform-origin:top left;pointer-events:none;background:#fff}
  .thumb .badge{position:absolute;top:8px;left:8px;background:rgba(29,36,48,.86);color:#fff;
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;z-index:2}
  .cap{padding:11px 13px}
  .cap .t{font-weight:700;font-size:14px}
  .cap .d{color:var(--muted);font-size:12px;margin-top:2px}
</style></head><body>
<div class="wrap">
  <h1>今日のキャパ — Capacity Board モックギャラリー</h1>
  <p class="lead">Instagantt の Workload 相当を OSS 自前で。TaskStation を土台に。UI検討（全72案）。切り口別・サムネクリックで実画面。</p>
  <div class="live" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0;padding:12px 14px;background:#eef5ff;border:1px solid #cfe0ff;border-radius:12px;font-size:14px">
    <b style="color:#1d2430">▶ 稼働中</b>
    <a href="http://leo:7010/app/" style="font-weight:700;color:#1565ff;text-decoration:none;background:#fff;border:1px solid #cfe0ff;border-radius:8px;padding:6px 12px">実データSPA（本番） → leo:7010/app/</a>
    <a href="http://leo:7005" style="font-weight:600;color:#3a4a5e;text-decoration:none;background:#fff;border:1px solid #d7dde6;border-radius:8px;padding:6px 12px">TaskStation本体 → leo:7005</a>
    <span style="color:#6b7480;font-size:12.5px">ログイン: capdemo / CapDemoPass123</span>
  </div>
  <div class="req"><b>要件 v0.1</b>　主目的=<b>空き容量さがし</b>／時間軸=<b>今日中心</b>／工数=<b>見積り時間</b>／容量=<b>一律8h/日</b>　·　データ源=TaskStation API（一部 Claude 要約）</div>
  <div class="nav" id="nav"></div>
  <div id="groups"></div>
</div>

  ]},
];
const nav=document.getElementById("nav"), groups=document.getElementById("groups");
GROUPS.forEach(g=>{
  const a=document.createElement("a"); a.href="#"+g.key; a.textContent=g.title.replace(/（.*）/,""); nav.appendChild(a);
  const sec=document.createElement("section"); sec.className="grp"; sec.id=g.key;
  sec.innerHTML=`<h2>${g.title}　<span style="color:var(--muted);font-weight:400">(${g.items.length})</span></h2><div class="gd">${g.desc}</div>`;
  const grid=document.createElement("div"); grid.className="grid";
  g.items.forEach(([n,t,href,d])=>{
    const it=document.createElement("a"); it.className="item"; it.href=href; it.target="_blank";
    it.innerHTML=`<div class="thumb"><span class="badge">${n}</span>
      <iframe loading="lazy" src="${href}"></iframe></div>
      <div class="cap"><div class="t">${t}</div><div class="d">${d}</div></div>`;
    grid.appendChild(it);
  });
  sec.appendChild(grid); groups.appendChild(sec);
});
</script>
</body></html>
