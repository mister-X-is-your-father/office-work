<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaskStation</title>
<!-- PWA -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#3a86ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TaskStation">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
  :root{--bg:#e8ecf3;--card:#fff;--ink:#1d2430;--muted:#6b7480;--line:#dde2ea;--line-strong:#cad1dc;--track:#eef1f5;
    --fill:#3a86ff;--over:#e5484d;--free:#2fa66b;--full:#8a93a0;
    --shadow:0 1px 2px rgba(20,30,50,.05),0 6px 18px rgba(20,30,50,.07);
    --font:"Hiragino Kaku Gothic ProN",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    /* Lucide settings（ナビ「設定」のギア用マスク。fill黒=mask不透明部、色は背景の currentColor で着く）。 */
    --ic-settings:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>')}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
    -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  /* スクロールバー: 全体統一のモダンな細い"浮きピル"型（Firefox=thin / WebKit=透明トラック＋角丸サム） */
  *{scrollbar-width:thin;scrollbar-color:rgba(20,30,50,.26) transparent}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:rgba(20,30,50,.22);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  *::-webkit-scrollbar-thumb:hover{background:rgba(20,30,50,.36);background-clip:padding-box}
  *::-webkit-scrollbar-corner{background:transparent}
  /* キーボード操作時のフォーカス可視（全画面共通・マウス時は出ない）。各要素の独自focus指定があればそちら優先 */
  :focus-visible{outline:2px solid var(--fill);outline-offset:2px}
  /* shell */
  .shell{display:flex;min-height:100vh}
  .sidebar{width:208px;flex:none;background:var(--card);border-right:1px solid var(--line);
    padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{font-weight:800;font-size:15px;padding:6px 10px 12px}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:10.5px;margin-top:2px}
  .addbtn{display:flex;align-items:center;gap:7px;width:100%;margin:2px 0 10px;padding:8px 11px;
    border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);
    font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background .12s,border-color .12s}
  .addbtn::before{content:"+";font-size:15px;font-weight:600;color:var(--fill);line-height:1}
  .addbtn:hover{background:var(--track);border-color:#d7dde6}
  .navgrp{font-size:10.5px;color:var(--muted);font-weight:700;margin:14px 10px 4px;letter-spacing:.04em}
  .nav a{display:block;padding:7px 11px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:13.5px;margin:1px 0}
  .nav a:hover{background:var(--track)}
  .nav a.active{background:#eaf1ff;color:var(--fill);font-weight:700}
  .nav a.soon{color:var(--muted)}
  /* 定期(業務/MTG)と後続項目の間の小さな余白。 */
  .nav-spacer{height:10px}
  /* 設定の直前に入れる区切り線＝最下部の独立感を出す。 */
  .nav-rule{height:1px;background:var(--line);margin:10px 8px 6px}
  /* 設定リンク（個人設定/チーム設定）の強調（最下部・目立たせる）。 */
  .nav a[data-k="settings-personal"],.nav a[data-k="settings-team"]{font-weight:700}
  /* 設定リンクのギア＝Lucide settings をマスクで currentColor 追従の単色アイコンに（旧 content:"⚙"）。 */
  .nav a[data-k="settings-personal"]::before,.nav a[data-k="settings-team"]::before{content:"";display:inline-block;width:15px;height:15px;margin-right:7px;vertical-align:-2px;background:currentColor;
    -webkit-mask:var(--ic-settings) center/contain no-repeat;mask:var(--ic-settings) center/contain no-repeat}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:10px 22px;
    border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
  .topbar .who{font-size:12px;color:var(--muted);margin-right:auto}
  /* モバイル: サイドバーをドロワー化（デスクトップ=820px超は一切変更しない） */
  .sb-toggle{display:none}
  .sb-backdrop{display:none}
  @media (max-width:820px){
    .sidebar{position:fixed;top:0;left:0;height:100dvh;z-index:40;transform:translateX(-100%);transition:transform .22s ease;box-shadow:6px 0 30px rgba(10,18,35,.18)}
    .sidebar.open{transform:none}
    .sb-backdrop.open{display:block;position:fixed;inset:0;background:rgba(10,18,35,.35);z-index:38}
    .sb-toggle{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);border-radius:8px;width:36px;height:32px;font-size:16px;cursor:pointer;flex:none;padding:0}
    .content{padding:18px 14px 60px}
  }
  .topbar button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer}
  .topbar button:hover{background:var(--track)}
  .content{padding:24px 26px 60px;max-width:980px}
  .content.wide{max-width:none}  /* 列の多い画面（一覧/表/タイムライン/ボード等）は上限なしで全幅 */
  /* shared view bits */
  .vtitle{font-size:20px;margin:0 0 16px}.vtitle small{font-weight:500;color:var(--muted);font-size:13px;margin-left:8px}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:120px;box-shadow:0 1px 3px rgba(20,30,50,.06)}
  .kpi .l{font-size:11px;color:var(--muted);margin-bottom:5px}.kpi .v{font-size:20px;font-weight:700;line-height:1}.kpi .v small{font-size:12px;color:var(--muted);font-weight:600}
  .kpi.free .v{color:var(--free)}.kpi.over .v{color:var(--over)}.kpi.under .v{color:var(--free)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .legend{display:flex;gap:16px;margin-top:12px;font-size:11.5px;color:var(--muted)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .loading{padding:40px;text-align:center;color:var(--muted)}
  /* login */
  .login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 28px;box-shadow:0 8px 28px rgba(20,30,50,.08)}
  .login h2{font-size:18px;margin:0 0 20px}
  .login input{display:block;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;margin-top:12px;background:var(--card);transition:border-color .15s,box-shadow .15s}
  .login input:hover{border-color:#c9cfd8}
  .login input:focus{outline:none;border-color:var(--fill);box-shadow:0 0 0 3px rgba(58,134,255,.18)}
  .login button{margin-top:22px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--fill);color:#fff;font-weight:700;cursor:pointer;font-size:14px;transition:filter .15s}
  .login button:hover{filter:brightness(1.08)}
  .login .err{color:var(--over);font-size:12px;margin-top:10px;min-height:16px}
  /* ===== ダークモード（構造色を反転。アクセントは共通） ===== */
  html[data-theme="dark"]{
    --bg:#161a21; --card:#1f242c; --ink:#e7eaef; --muted:#9aa3af;
    --line:#2c333d; --line-strong:#3b434f; --track:#262c34;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 22px rgba(0,0,0,.5);
  }
  /* シェルのハードコード淡色を暗側に上書き */
  html[data-theme="dark"] .nav a.active{background:rgba(58,134,255,.22)}
  html[data-theme="dark"] .addbtn:hover{border-color:var(--line-strong)}
  html[data-theme="dark"] .login input:hover{border-color:var(--line-strong)}
  /* 主力(一覧/アウトライン/依存グラフ)の淡色を暗側へ: 表ヘッダ・hover・ステータスチップ */
  html[data-theme="dark"] .tb th{background:#222932}
  html[data-theme="dark"] .tb tbody tr:hover{background:rgba(255,255,255,.05)}
  html[data-theme="dark"] .tb-cell:hover{background:rgba(255,255,255,.07);border-color:var(--line-strong)}
  html[data-theme="dark"] .tb-st.todo,html[data-theme="dark"] .ol-st.todo,html[data-theme="dark"] .dg-st.todo{background:rgba(255,255,255,.08)}
  html[data-theme="dark"] .tb-st.doing,html[data-theme="dark"] .ol-st.doing,html[data-theme="dark"] .dg-st.doing{background:rgba(58,134,255,.20);color:#8db8ff}
  html[data-theme="dark"] .tb-st.waiting,html[data-theme="dark"] .ol-st.waiting,html[data-theme="dark"] .dg-st.waiting{background:rgba(245,166,36,.20);color:#e9b765}
  html[data-theme="dark"] .tb-st.done,html[data-theme="dark"] .ol-st.done,html[data-theme="dark"] .dg-st.done{background:rgba(47,166,107,.20);color:#63cf95}
  /* フォーム部品(白背景ハードコード含む)を一括ダーク化 */
  html[data-theme="dark"] input:not([type="color"]),html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:var(--card);color:var(--ink);border-color:var(--line)}
  /* 主力ツールバーの白ボタン/チップ */
  html[data-theme="dark"] .tb-add,html[data-theme="dark"] .tb-manbtn,html[data-theme="dark"] .tb-qa,html[data-theme="dark"] .tb-sc-k{background:var(--card);color:var(--ink)}
  /* テーマ切替トグル（サイドバー下部） */
  .theme-tg{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:14px;padding:8px 11px;
    border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:background .12s,border-color .12s,color .12s}
  .theme-tg:hover{background:var(--track);color:var(--ink);border-color:var(--line-strong)}
</style>
<script>try{var _t=localStorage.getItem("ts.theme");if(_t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
</head>
<body>
<div id="app"><div class="loading">読み込み中…</div></div>
<script type="module" src="./app.js"></script>
</body>
</html>
